name: 'Build dist branch'
description: 'Build npm package and push to dist branch'

inputs:
  prebuilt_dir:
    description: 'Path to pre-built output directory. When set, skips checkout/setup/build and only manages the dist branch.'
    required: false
    default: ''
  source_ref:
    description: 'Source ref to build from (defaults to repository default branch)'
    required: false
    default: ''
  node_version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  pnpm_version:
    description: 'pnpm version to use (only used if pnpm detected)'
    required: false
    default: '10'
  build_command:
    description: 'Build command to run (default: auto-detect from package manager)'
    required: false
    default: ''
  dist_branch:
    description: 'Name of dist branch'
    required: false
    default: 'dist'
  build_dir:
    description: 'Directory created by build command (moved to root on dist branch)'
    required: false
    default: 'dist'
  source_dirs:
    description: 'Comma-separated list of directories to include (e.g., "src,types"). If set, these are preserved as-is instead of moving dist/* to root.'
    required: false
    default: ''
  extra_files:
    description: 'Comma-separated list of additional files to include alongside build output (e.g., "src/styles.css,README.md")'
    required: false
    default: ''
  version_suffix:
    description: 'Add version suffix with git SHA (e.g., 0.1.0-dist.abc1234). Set to "false" to disable.'
    required: false
    default: 'true'
  pkg_include:
    description: 'Comma-separated list of package.json fields to include from source (default: name,description,keywords,repository,author,license,homepage,bugs,exports)'
    required: false
    default: ''
  pkg_exclude:
    description: 'Comma-separated list of package.json fields to exclude from merge (overrides include list)'
    required: false
    default: ''
  pkg_kvs:
    description: 'JSON object of key-value overrides for package.json (e.g., {"name":"custom-name"})'
    required: false
    default: ''
  pkgs:
    description: 'Monorepo mode: comma-separated package paths (e.g., "packages/client,packages/cli"). Uses pnpm pack to resolve workspace/catalog refs, preserves directory structure on dist branch.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout (standard mode)
      if: inputs.prebuilt_dir == ''
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
        fetch-depth: 0

    - name: Get source info (prebuilt mode)
      if: inputs.prebuilt_dir != ''
      id: prebuilt_info
      shell: bash
      run: |
        echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        if [ -f "${{ inputs.prebuilt_dir }}/package.json" ]; then
          echo "pkg_name=$(jq -r .name '${{ inputs.prebuilt_dir }}/package.json')" >> $GITHUB_OUTPUT
        else
          echo "pkg_name=unknown" >> $GITHUB_OUTPUT
        fi
        echo "pm=pnpm" >> $GITHUB_OUTPUT  # default for install command output

    - name: Get package and source info (standard mode)
      if: inputs.prebuilt_dir == ''
      id: info
      shell: bash
      run: |
        echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "pkg_name=$(jq -r .name package.json)" >> $GITHUB_OUTPUT

        # Detect package manager from lock files
        if [ -f "pnpm-lock.yaml" ]; then
          echo "pm=pnpm" >> $GITHUB_OUTPUT
        elif [ -f "bun.lockb" ]; then
          echo "pm=bun" >> $GITHUB_OUTPUT
        elif [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        elif [ -f "package-lock.json" ]; then
          echo "pm=npm" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT  # fallback
        fi
        echo "Detected package manager: $(grep '^pm=' $GITHUB_OUTPUT | cut -d= -f2)"

    - name: Setup pnpm
      if: inputs.prebuilt_dir == '' && steps.info.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm_version }}

    - name: Setup Node.js
      if: inputs.prebuilt_dir == ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ steps.info.outputs.pm }}

    - name: Install dependencies
      if: inputs.prebuilt_dir == ''
      shell: bash
      run: |
        case "${{ steps.info.outputs.pm }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          npm)  npm ci ;;
          yarn) yarn install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
        esac

    - name: Build
      if: inputs.prebuilt_dir == ''
      shell: bash
      run: |
        BUILD_CMD="${{ inputs.build_command }}"
        if [ -z "$BUILD_CMD" ]; then
          BUILD_CMD="${{ steps.info.outputs.pm }} run build"
        fi
        $BUILD_CMD

    - name: Commit to dist branch (standard mode)
      if: inputs.pkgs == ''
      shell: bash
      env:
        DIST_BRANCH: ${{ inputs.dist_branch || 'dist' }}
        BUILD_DIR: ${{ inputs.prebuilt_dir || inputs.build_dir }}
        SOURCE_DIRS: ${{ inputs.source_dirs }}
        EXTRA_FILES: ${{ inputs.extra_files }}
        VERSION_SUFFIX: ${{ inputs.version_suffix }}
        PKG_INCLUDE: ${{ inputs.pkg_include }}
        PKG_EXCLUDE: ${{ inputs.pkg_exclude }}
        PKG_KVS: ${{ inputs.pkg_kvs }}
      run: ${{ github.action_path }}/scripts/build-dist.sh ${{ steps.prebuilt_info.outputs.source_sha || steps.info.outputs.source_sha }}

    - name: Commit to dist branch (monorepo mode)
      if: inputs.pkgs != ''
      shell: bash
      env:
        DIST_BRANCH: ${{ inputs.dist_branch || 'dist' }}
        PKGS: ${{ inputs.pkgs }}
        VERSION_SUFFIX: ${{ inputs.version_suffix }}
      run: ${{ github.action_path }}/scripts/build-dist-monorepo.sh ${{ steps.prebuilt_info.outputs.source_sha || steps.info.outputs.source_sha }}

    - name: Get dist SHA
      id: dist
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Push dist branch
      shell: bash
      run: git push origin ${{ inputs.dist_branch || 'dist' }} --force-with-lease

    - name: Output dist branch info
      shell: bash
      env:
        PKGS: ${{ inputs.pkgs }}
      run: |
        PKG_NAME="${{ steps.prebuilt_info.outputs.pkg_name || steps.info.outputs.pkg_name }}"
        DIST_BRANCH="${{ inputs.dist_branch || 'dist' }}"
        DIST_SHA="${{ steps.dist.outputs.sha }}"
        SOURCE_SHA="${{ steps.prebuilt_info.outputs.source_sha || steps.info.outputs.source_sha }}"
        REPO="${{ github.repository }}"
        PM="${{ steps.prebuilt_info.outputs.pm || steps.info.outputs.pm }}"

        echo ""
        echo "=========================================="
        echo "✅ Dist branch updated successfully!"
        echo "=========================================="
        echo ""
        echo "🌿 Branch: ${DIST_BRANCH}"
        echo "🔗 Dist SHA: ${DIST_SHA}"
        echo "📝 Source SHA: ${SOURCE_SHA}"
        echo ""

        if [ -n "$PKGS" ]; then
          echo "📦 Monorepo packages:"
          IFS=',' read -ra PKG_PATHS <<< "$PKGS"
          for pkg_path in "${PKG_PATHS[@]}"; do
            pkg_path=$(echo "$pkg_path" | xargs)
            pkg_name=$(jq -r .name "$pkg_path/package.json" 2>/dev/null || echo "$pkg_path")
            echo "  - $pkg_name"
          done
          echo ""
          echo "To use these packages (pnpm 9+ git subdirectory syntax):"
          for pkg_path in "${PKG_PATHS[@]}"; do
            pkg_path=$(echo "$pkg_path" | xargs)
            pkg_name=$(jq -r .name "$pkg_path/package.json" 2>/dev/null || echo "$pkg_path")
            echo "  \"$pkg_name\": \"git+https://github.com/${REPO}.git?path=/${pkg_path}#${DIST_SHA}\""
          done
          echo ""
          echo "::notice title=🌿 Dist Branch Updated::${DIST_BRANCH} @ ${DIST_SHA:0:7} (monorepo)"
        else
          echo "📦 Package: ${PKG_NAME}"
          echo ""
          echo "To use this version:"
          echo "  ${PM} add github:${REPO}#${DIST_SHA}"
          echo ""
          echo "::notice title=🌿 Dist Branch Updated::${DIST_BRANCH} @ ${DIST_SHA:0:7}"
          echo "::notice title=📦 Install Command::${PM} add github:${REPO}#${DIST_SHA}"
        fi
