name: 'Build dist branch'
description: 'Build npm package and push to dist branch'

inputs:
  source_ref:
    description: 'Source ref to build from (defaults to repository default branch)'
    required: false
    default: ''
  node_version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  pnpm_version:
    description: 'pnpm version to use (only used if pnpm detected)'
    required: false
    default: '10'
  build_command:
    description: 'Build command to run (default: auto-detect from package manager)'
    required: false
    default: ''
  dist_branch:
    description: 'Name of dist branch'
    required: false
    default: 'dist'
  build_dir:
    description: 'Directory created by build command (moved to root on dist branch)'
    required: false
    default: 'dist'
  source_dirs:
    description: 'Comma-separated list of directories to include (e.g., "src,types"). If set, these are preserved as-is instead of moving dist/* to root.'
    required: false
    default: ''
  extra_files:
    description: 'Comma-separated list of additional files to include alongside build output (e.g., "src/styles.css,README.md")'
    required: false
    default: ''
  version_suffix:
    description: 'Add version suffix with git SHA (e.g., 0.1.0-dist.abc1234). Set to "false" to disable.'
    required: false
    default: 'true'
  pkg_include:
    description: 'Comma-separated list of package.json fields to include from source (default: name,description,keywords,repository,author,license,homepage,bugs,exports)'
    required: false
    default: ''
  pkg_exclude:
    description: 'Comma-separated list of package.json fields to exclude from merge (overrides include list)'
    required: false
    default: ''
  pkg_kvs:
    description: 'JSON object of key-value overrides for package.json (e.g., {"name":"custom-name"})'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_ref || github.event.repository.default_branch }}
        fetch-depth: 0

    - name: Get package and source info
      id: info
      shell: bash
      run: |
        echo "source_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
        echo "pkg_name=$(jq -r .name package.json)" >> $GITHUB_OUTPUT

        # Detect package manager from lock files
        if [ -f "pnpm-lock.yaml" ]; then
          echo "pm=pnpm" >> $GITHUB_OUTPUT
        elif [ -f "bun.lockb" ]; then
          echo "pm=bun" >> $GITHUB_OUTPUT
        elif [ -f "yarn.lock" ]; then
          echo "pm=yarn" >> $GITHUB_OUTPUT
        elif [ -f "package-lock.json" ]; then
          echo "pm=npm" >> $GITHUB_OUTPUT
        else
          echo "pm=npm" >> $GITHUB_OUTPUT  # fallback
        fi
        echo "Detected package manager: $(grep '^pm=' $GITHUB_OUTPUT | cut -d= -f2)"

    - name: Setup pnpm
      if: steps.info.outputs.pm == 'pnpm'
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm_version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: ${{ steps.info.outputs.pm }}

    - name: Install dependencies
      shell: bash
      run: |
        case "${{ steps.info.outputs.pm }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          npm)  npm ci ;;
          yarn) yarn install --frozen-lockfile ;;
          bun)  bun install --frozen-lockfile ;;
        esac

    - name: Build
      shell: bash
      run: |
        BUILD_CMD="${{ inputs.build_command }}"
        if [ -z "$BUILD_CMD" ]; then
          BUILD_CMD="${{ steps.info.outputs.pm }} run build"
        fi
        $BUILD_CMD

    - name: Build and commit to dist branch
      shell: bash
      env:
        DIST_BRANCH: ${{ inputs.dist_branch || 'dist' }}
        BUILD_DIR: ${{ inputs.build_dir }}
        SOURCE_DIRS: ${{ inputs.source_dirs }}
        EXTRA_FILES: ${{ inputs.extra_files }}
        VERSION_SUFFIX: ${{ inputs.version_suffix }}
        PKG_INCLUDE: ${{ inputs.pkg_include }}
        PKG_EXCLUDE: ${{ inputs.pkg_exclude }}
        PKG_KVS: ${{ inputs.pkg_kvs }}
      run: ${{ github.action_path }}/scripts/build-dist.sh ${{ steps.info.outputs.source_sha }}

    - name: Get dist SHA
      id: dist
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Push dist branch
      shell: bash
      run: git push origin ${{ inputs.dist_branch || 'dist' }} --force-with-lease

    - name: Output dist branch info
      shell: bash
      run: |
        PKG_NAME="${{ steps.info.outputs.pkg_name }}"
        DIST_BRANCH="${{ inputs.dist_branch || 'dist' }}"
        DIST_SHA="${{ steps.dist.outputs.sha }}"
        SOURCE_SHA="${{ steps.info.outputs.source_sha }}"
        REPO="${{ github.repository }}"
        PM="${{ steps.info.outputs.pm }}"

        echo ""
        echo "=========================================="
        echo "✅ Dist branch updated successfully!"
        echo "=========================================="
        echo ""
        echo "📦 Package: ${PKG_NAME}"
        echo "🌿 Branch: ${DIST_BRANCH}"
        echo "🔗 Dist SHA: ${DIST_SHA}"
        echo "📝 Source SHA: ${SOURCE_SHA}"
        echo ""
        echo "To use this version:"
        echo "  ${PM} add github:${REPO}#${DIST_SHA}"
        echo ""

        # Add annotations that appear on Summary page
        echo "::notice title=🌿 Dist Branch Updated::${DIST_BRANCH} @ ${DIST_SHA:0:7}"
        echo "::notice title=📦 Install Command::${PM} add github:${REPO}#${DIST_SHA}"
